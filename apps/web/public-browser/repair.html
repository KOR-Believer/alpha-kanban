<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpha Kanban</title>
    <link rel="stylesheet" href="/repair.css" />
    <script src="/repair.js" defer></script>
  </head>
  <body>
    <main>
      <header><strong>Alpha Kanban</strong><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></header>
      <h1 data-copy="title">앱 복구</h1>
      <p data-copy="description">화면이 열리지 않거나 오래된 화면에 머물러 있나요? 인터넷에 연결한 뒤 다른 Alpha Kanban 창을 모두 닫고 다시 시도하세요.</p>
      <p data-copy="preserved">연결한 폴더, 사용자 설정과 파일 저장 복구 기록은 지우지 않습니다. 원본 Markdown도 변경하지 않습니다.</p>
      <button id="repair" data-copy="button" type="button">앱 파일 다시 받기</button>
      <p id="result" role="status" aria-live="polite"></p>
      <a href="/" data-copy="return">앱으로 돌아가기</a>
    </main>
  </body>
</html>
